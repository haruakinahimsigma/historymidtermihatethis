p:9px;flex-wrap:wrap;padding-top:20px}.primary,.secondary{border-radius:11px;padding:10px 15px;font-weight:750}.primary{background:var(--accent);color:#0c1222;border:1px solid var(--accent)}.primary:hover{background:#a9b5ff}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.secondary:hover{border-color:#6578aa}.result{display:none;padding:16px;margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.result.show{display:block}.result strong{font-size:23px}.hint{font-size:13px;color:var(--muted);margin-top:12px}.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{position:static}.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.set{font-size:13px;padding:8px}.hero{padding:22px}.wrap{width:min(100% - 20px,980px);padding-top:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

{title:"鎌倉幕府の成立",qs:[
["鎌倉幕府を開いた人物は？",["源頼朝","源義経","平清盛","足利尊氏"],0,"源頼朝が鎌倉を拠点に武士の政権を築いた。"],

["御家人が将軍のために軍役などを果たすことは？",["御恩","奉公","院政","下剋上"],1,"奉公は軍役や警備など、将軍に仕える義務。御恩とセット。"],

["記述：守護と地頭の違いを説明しよう。",null,null,"守護は国ごとに軍事・警察を担当し、地頭は荘園・公領で土地管理や年貢徴収などを行った。"]

{title:"執権政治・承久の乱",qs:[

["記述：御成敗式目の目的を説明しよう。",null,null,"武士社会の争いを公平に裁くため、武士の慣習などをもとに基準を定めた。"]

{title:"元寇と鎌倉幕府のおとろえ",qs:[

["元が最初に日本へ攻めてきた1274年の戦いは？",["文永の役","弘安の役","承久の乱","壇ノ浦の戦い"],0,"1274年が文永の役。"],

["元寇のとき幕府の執権だった人物は？",["北条時宗","北条泰時","北条政子","北条義時"],0,"北条時宗が元寇の際の執権だった。"],

["生活に困った御家人を救うため、幕府が出した借金帳消しの法令は？",["徳政令","御成敗式目","武家諸法度","刀狩令"],0,"1297年の永仁の徳政令は御家人の借金問題に対応しようとした。"],

["鎌倉幕府が滅亡した年は？",["1274年","1281年","1333年","1392年"],2,"1333年に鎌倉幕府が滅亡した。"],
["鎌倉幕府を倒すために活躍した武士で、六波羅探題を攻めた人物は？",["足利尊氏","平清盛","藤原道長","徳川家康"],0,"足利尊氏は京都の六波羅探題を攻め、幕府滅亡に貢献した。"],
["記述：元寇の後、鎌倉幕府がおとろえた理由を説明しよう。",null,null,"御家人は防衛の負担を負ったが、元寇では新たな領地を得られず、十分な恩賞を受けにくかったため。"],

{title:"鎌倉時代の仏教・文化",qs:[

["浄土真宗を開いた人物は？",["法然","親鸞","栄西","道元"],1,"親鸞は法然の教えを発展させて浄土真宗を開いた。"],
["時宗を開き、踊念仏で知られる人物は？",["一遍","日蓮","栄西","最澄"],0,"一遍は時宗を開き、踊念仏で各地を巡った。"],

["東大寺南大門の金剛力士像を制作した仏師は？",["運慶・快慶","雪舟","狩野永徳","本阿弥光悦"],0,"運慶・快慶らが力強い写実的な仏像を制作した。"],
